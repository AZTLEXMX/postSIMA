[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postsima"
version = "3.0.0"
description = "Extractor y consolidación de estaciones de carga eléctrica"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.7,<1.0",
    "geopandas>=0.14,<2.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "shapely>=2.0,<3.0",
    "tqdm>=4.66,<5.0",
    "psycopg[binary]>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
postsima = "postsima.presentation.cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
